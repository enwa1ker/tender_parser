name: Tender Parser

on:
  schedule:
    # UTC время (Бишкек = UTC+6, вычитаем 6 часов)
    - cron: '0 20 * * *'   # 02:00 Бишкек — ночной прогон kumtor.kg
    - cron: '0 2 * * *'    # 08:00 Бишкек — начало рабочего дня
    - cron: '0 5 * * *'    # 11:00 Бишкек — утренний пик
    - cron: '0 8 * * *'    # 14:00 Бишкек — после обеда
    - cron: '0 11 * * *'   # 17:00 Бишкек — конец дня

  workflow_dispatch:
    inputs:
      reason:
        description: 'Причина ручного запуска'
        required: false
        default: 'manual'

jobs:
  parse:
    name: Run Tender Parser
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Write Google credentials
        run: echo '${{ secrets.GOOGLE_CREDENTIALS_JSON }}' > credentials.json

      - name: Check sites availability
        run: python check_sites.py
        continue-on-error: true  # Не останавливаем job если сайт недоступен

      - name: Run parser
        env:
          TELEGRAM_BOT_TOKEN:      ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_IDS:       ${{ secrets.TELEGRAM_CHAT_IDS }}
          TELEGRAM_ADMIN_IDS:      ${{ secrets.TELEGRAM_ADMIN_IDS }}
          GOOGLE_SHEET_ID:         ${{ secrets.GOOGLE_SHEET_ID }}
          HEALTHCHECK_URL:         ${{ secrets.HEALTHCHECK_URL }}
          GOOGLE_CREDENTIALS_FILE: credentials.json
          SINGLE_RUN_MODE:         "true"
        run: python main.py

      - name: Notify admins on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_IDS: ${{ secrets.TELEGRAM_ADMIN_IDS }}
        run: |
          python - <<'EOF'
          import os, requests
          token = os.environ.get("TELEGRAM_BOT_TOKEN", "")
          admins = os.environ.get("TELEGRAM_ADMIN_IDS", "").split(",")
          if not token:
              exit(0)
          run_url = f"https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          msg = (
              "❌ *Парсер упал на GitHub Actions!*\n\n"
              f"[Смотреть логи]({run_url})\n\n"
              "Зайди по ссылке и найди строку с ❌"
          )
          for chat_id in admins:
              chat_id = chat_id.strip()
              if chat_id:
                  requests.post(
                      f"https://api.telegram.org/bot{token}/sendMessage",
                      json={"chat_id": chat_id, "text": msg, "parse_mode": "Markdown"},
                      timeout=10,
                  )
          EOF
